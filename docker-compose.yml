

version: "3.9"

services:
  # === The Memory (Database) ===
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uet_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uetlab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === The Brain (Rust API) ===
  uet_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: uet_api_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/uetlab
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost:3002/auth/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3002}
    ports:
      - "3001:3001"
    command: ["uet_api"]

  # === The Mind (Python Agent) ===
  uet_agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    container_name: uet_agent_server
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    ports:
      - "8001:8001"

  # === The Face (Next.js Web) ===
  uet_web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        DATABASE_URL: postgres://postgres:postgres@postgres:5432/uetlab
    container_name: uet_web_server
    depends_on:
      - uet_api
      - uet_agents
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_AGENT_URL=http://uet_agents:8001
      - NEXT_PUBLIC_API_URL=http://uet_api:3001
      - NEXT_PUBLIC_ROCKETCHAT_URL=http://localhost:3200
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/uetlab
      - PORT=3000
    ports:
      - "3005:3000"
    command: ["node", "server.js"]

  # === The Voice (Rocket.Chat — Real-time Chat) ===
  mongo:
    image: mongo:6
    container_name: uet_mongo
    volumes:
      - mongo_data:/data/db
    command: mongod --oplogSize 128 --replSet rs0
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }" | mongosh --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    container_name: uet_rocketchat
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://mongo:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://mongo:27017/local?replicaSet=rs0
      - ROOT_URL=http://localhost:3200
      - PORT=3000
      - DEPLOY_METHOD=docker
      - OVERWRITE_SETTING_Show_Setup_Wizard=completed
      - ADMIN_USERNAME=${RC_ADMIN_USERNAME:-admin}
      - ADMIN_PASS=${RC_ADMIN_PASS:-admin123}
      - ADMIN_EMAIL=${RC_ADMIN_EMAIL:-admin@uet-platform.com}
    ports:
      - "3200:3000"

  # === The Eyes (LiveKit — Video/Voice) ===
  livekit:
    image: livekit/livekit-server:latest
    container_name: uet_livekit
    ports:
      - "7880:7880"
      - "7881:7881"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}
    command: --dev --bind 0.0.0.0

volumes:
  postgres_data:
  mongo_data:
